services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    volumes:
      - ..:/workspaces/Aercom-Gestion-Servicios:cached
    env_file: .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    env_file: .env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aercom_demo", "-d", "aercom_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-demo:/var/lib/postgresql/data
volumes:
  postgres-demo:
