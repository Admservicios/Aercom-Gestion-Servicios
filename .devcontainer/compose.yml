services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/Aercom-Gestion-Servicios:cached
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: aercom_demo
      POSTGRES_USER: aercom_demo
      POSTGRES_PASSWORD: aercom-local-demo
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aercom_demo
      POSTGRES_USER: aercom_demo
      POSTGRES_PASSWORD: aercom-local-demo
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aercom_demo", "-d", "aercom_demo"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-demo:/var/lib/postgresql/data
volumes:
  postgres-demo:
