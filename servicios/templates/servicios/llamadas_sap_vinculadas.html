<ul>{% for llamada in llamadas %}

    · {% if llamada.cerrada_en_sap %}Cerrada en SAP el {{ llamada.cerrada_en_sap|date:"d/m/Y" }}{% else %}Sin cierre registrado{% endif %}</li>
