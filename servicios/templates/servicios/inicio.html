{% extends "servicios/base.html" %}
{% block contenido %}
<h1>Tickets</h1>
<p><a class="boton" href="{% url 'nuevo' %}">Nuevo ticket</a></p>
<article>
<form method="get"><label for="q">Buscar por número, asunto, cliente o equipo</label>
<input id="q" name="q" value="{{ consulta }}"><button>Buscar</button></form>
<ul>{% for ticket in tickets %}<li><a href="{% url 'ticket' ticket.pk %}">T-{{ ticket.pk }} · {{ ticket.asunto }}</a> · {{ ticket.cliente }}</li>{% empty %}<li>Sin tickets para mostrar.</li>{% endfor %}</ul>
</article>
{% endblock %}
